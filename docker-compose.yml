version: '3.8'

services:
  evolution-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MANAGER_PORT:-3050}:80"
    container_name: evolution-manager-v2
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - evolution-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "${EVOLUTION_API_PORT:-8080}:${SERVER_PORT:-8080}"
    container_name: evolution-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:?}:${POSTGRES_DB_PORT:-5432}/${POSTGRES_DB:-evolution}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-your-api-key-here}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - CACHE_REDIS_ENABLED=${CACHE_REDIS_ENABLED:-true}
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=${CACHE_REDIS_PREFIX_KEY:-evolution}
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_ALLOWED_HOSTS=${WEBSOCKET_ALLOWED_HOSTS:-*}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CORS_METHODS=${CORS_METHODS:-GET,POST,PUT,DELETE,PATCH,OPTIONS}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
    depends_on:
      - redis
    networks:
      - evolution-network

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    networks:
      - evolution-network

networks:
  evolution-network:
    driver: bridge
